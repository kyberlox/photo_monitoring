services:

  nginx:
    image: nginx:alpine
    container_name: nginx_async
    depends_on:
      - fastapi
      #- frontend
    ports:
      - "80:80"
      #- "443:443"
    environment:
      - NGINX_HOST=${DOMAIN}
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres_async
    environment:
      POSTGRES_DB: "pdb"
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${pswd}
    volumes:
      - ./pSQL/data:/var/lib/postgresql/data
    ports:
      #- "127.0.0.1:5432:5432"
      - "5432:5432"
    networks:
      - app-network

  fastapi:
    build: ./app
    container_name: fastapi_async
    volumes:
      - ./app:/data/app
    env_file:
      - .env
    environment:
      - TZ=Europe/Saratov
    ports:
      - "8000:8000"
      #- "127.0.0.1:8000:8000"
    depends_on:
      - postgres
    networks:
      - app-network
  
  # frontend:
